</legend>

Address<input type="text" name="add"><br><br>

<legend align="center" >
Gender
</legend>

</fieldset>
<form>
<br><br><input type="submit" name="sbutton" value="SUBMIT"><br><br>
<input type="reset" name="resetbutton" value="Clear"><br><br>
